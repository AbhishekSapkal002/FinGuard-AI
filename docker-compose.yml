version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finguard_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - finguard_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finguard_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finguard_network

networks:
  finguard_network:
    driver: bridge
