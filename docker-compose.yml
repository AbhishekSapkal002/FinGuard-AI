version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finguard-backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: finguard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
